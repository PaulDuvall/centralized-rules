# Dependabot configuration — automated version & security update PRs.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Only git-tracked manifests are scanned. Deliberately NOT listed:
#   - site/                      (gitignored build artifact)
#   - skill/tests/fixtures/*     (intentionally pinned sample projects; not real deps)
# Grouped updates keep minor/patch bumps to one PR per ecosystem per week;
# major bumps still arrive as individual PRs so they get a proper review.
version: 2
updates:
  # --- npm: the skill package (source of the recent security alerts) ---
  - package-ecosystem: "npm"
    directory: "/skill"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      npm-production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # --- pip: MkDocs docs toolchain at repo root (requirements-docs.txt) ---
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-docs:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- pip: audit-agent tooling (scripts/audit-agent/requirements.txt) ---
  - package-ecosystem: "pip"
    directory: "/scripts/audit-agent"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-audit-agent:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions used across all workflows ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
